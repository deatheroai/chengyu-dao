<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe0b8" />
    <title>Catch the Meaning — Phase 2 (Movement + Jump) Spike</title>
    <link rel="stylesheet" href="/src/platform-catch/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="catch-ui-layer">
        <p id="catch-hint">Walk and jump to the kids who show 一心一意 — leave the distracted ones alone!</p>
        <div id="catch-status" aria-live="polite" data-revealed-count="0" data-total="4" data-complete="false"></div>
      </div>
      <!-- Test-only hook mirroring the character's x position (Phase 2's
           movement is continuous, unlike every earlier snippet's discrete
           tap/click steps, so E2E coverage needs a way to read real
           position between moves rather than predicting it from timing
           alone) — not part of the child-facing UI, never shown. -->
      <div id="player-position" data-x="0" style="display: none" aria-hidden="true"></div>
      <div id="controls-layer">
        <div class="dpad">
          <button id="move-left-btn" class="ctrl-btn" type="button" aria-label="Move left">◀</button>
          <button id="move-right-btn" class="ctrl-btn" type="button" aria-label="Move right">▶</button>
        </div>
        <button id="jump-btn" type="button" aria-label="Jump">JUMP</button>
      </div>
      <div id="catch-complete-card">
        <div class="card">
          <p data-hanzi></p>
          <p data-pinyin></p>
          <p data-meaning></p>
          <button id="play-again-btn" type="button">🔁 Play again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/platform-catch/main.ts"></script>
  </body>
</html>
