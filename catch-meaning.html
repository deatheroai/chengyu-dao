<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe0b8" />
    <title>Catch the Meaning — Phase 0 Spike</title>
    <link rel="stylesheet" href="/src/catch-meaning/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="catch-ui-layer">
        <p id="catch-hint">Drag the basket to catch things that show 一心一意 — ignore the rest!</p>
        <div id="catch-status" aria-live="polite" data-revealed-count="0" data-total="4" data-complete="false"></div>
      </div>
      <div id="catch-complete-card">
        <div class="card">
          <p data-hanzi></p>
          <p data-pinyin></p>
          <p data-meaning></p>
          <button id="play-again-btn" type="button">🔁 Play again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/catch-meaning/main.ts"></script>
  </body>
</html>
