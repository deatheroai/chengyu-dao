<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe0b8" />
    <title>Idiom Meaning Check — Snippet 3 Prototype</title>
    <link rel="stylesheet" href="/src/meaning-check/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="card">
        <div class="idiom-header">
          <div class="hanzi" id="idiom-hanzi" lang="zh-Hans"></div>
          <div class="pinyin" id="idiom-pinyin"></div>
        </div>
        <p class="meaning" id="idiom-meaning"></p>

        <h2 class="prompt">
          Which one of these is really about
          <span class="prompt-idiom" id="prompt-idiom" lang="zh-Hans"></span>?
        </h2>
        <div class="options" id="options"></div>

        <p id="check-status" aria-live="polite" data-status="choosing" data-attempts="0"></p>
        <p id="explanation" class="explanation hidden"></p>

        <button id="next-btn" class="hidden" type="button">Next idiom →</button>
      </main>
    </div>
    <script type="module" src="/src/meaning-check/main.ts"></script>
  </body>
</html>
