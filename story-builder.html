<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef6ff" />
    <meta name="description" content="一起编故事：write a story together with 团团 the panda, spin a mission to make each sentence richer, then practise writing your own characters." />
    <title>一起编故事</title>
    <link rel="stylesheet" href="/src/story-builder/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <button class="icon-btn" id="btn-home" type="button" aria-label="回到首页" style="visibility: hidden">←</button>
        <h1>🐼 一起编故事</h1>
        <button class="pill-toggle" id="btn-pinyin" type="button" aria-pressed="true">拼音</button>
      </header>

      <!-- Home: choose an adventure, or open a saved story -->
      <section id="view-home" class="view">
        <p class="intro">我是团团！我写一句，你写一句，我们一起编一个故事吧。<br />每写好一句，就转一转<b>任务转盘</b>，让句子变得更生动！</p>
        <div class="adventure-grid" id="adventure-grid"></div>
        <form class="idea-card" id="idea-card" hidden>
          <label for="idea-input">✏️ 我自己的想法</label>
          <div class="idea-row">
            <input id="idea-input" maxlength="60" placeholder="一只会飞的小狗……" lang="zh-Hans" autocomplete="off" />
            <button class="btn btn-primary" id="btn-idea" type="submit">开始！</button>
          </div>
          <p class="hint" id="idea-hint" aria-live="polite"></p>
        </form>
        <div class="library" id="library" hidden>
          <h2>📚 我的故事书</h2>
          <ul class="library-list" id="library-list"></ul>
        </div>
      </section>

      <!-- Play: the story so far, plus the current turn -->
      <section id="view-play" class="view" hidden>
        <h2 class="play-title" id="play-title"></h2>
        <ol class="story-flow" id="story-flow" aria-live="polite"></ol>

        <div class="turn-card" id="turn" hidden>
          <p class="turn-label">✏️ 轮到你了 <span class="turn-count" id="turn-count"></span></p>
          <p class="turn-prompt" id="turn-prompt"></p>
          <div class="input-wrap">
            <textarea id="sentence" rows="2" placeholder="写一句话……" lang="zh-Hans" autocomplete="off"></textarea>
            <button class="icon-btn mic" id="btn-mic" type="button" aria-label="说一说" hidden>🎤</button>
          </div>
          <p class="hint" id="turn-hint" aria-live="polite"></p>
          <button class="btn btn-primary" id="btn-written" type="button">写好了 →</button>

          <div class="spin-area" id="spin-area" hidden>
            <div class="wheel-wrap">
              <div class="wheel-pointer" aria-hidden="true">▼</div>
              <div class="wheel" id="wheel"></div>
            </div>
            <button class="btn btn-primary btn-spin" id="btn-spin" type="button">转一转 🎡</button>
          </div>

          <div class="mission" id="mission" hidden>
            <p class="mission-title" id="mission-title"></p>
            <p class="mission-question" id="mission-question"></p>
            <button class="link-btn" id="btn-hint" type="button">💡 提示</button>
            <p class="hint-words" id="hint-words" hidden></p>
            <p class="partner-note" id="partner-note" hidden></p>
            <p class="thinking" id="thinking" hidden>🐼 团团在读你的句子……</p>
            <div class="actions">
              <button class="btn" id="btn-skip" type="button">跳过</button>
              <button class="btn btn-primary" id="btn-done" type="button">完成任务 ✓</button>
            </div>
          </div>
        </div>

        <!-- The end -->
        <div class="turn-card end-card" id="turn-end" hidden>
          <p class="end-title">🎉 故事写完了！</p>
          <p class="end-stars" id="end-stars"></p>
          <div class="actions center">
            <button class="btn" id="btn-read-all" type="button">🔊 读整个故事</button>
            <button class="btn btn-primary" id="btn-again" type="button">再编一个</button>
          </div>
          <p class="hint">故事已经放进“我的故事书”里了。</p>

          <div class="practise" id="practise">
            <h3>✍️ 练一练你故事里的字</h3>
            <p class="hint">选 1～3 个你想学会写的字：</p>
            <div class="char-pick" id="char-pick"></div>
            <button class="btn btn-primary" id="btn-practise" type="button" disabled>开始练字</button>
            <div class="practise-pad" id="practise-pad-wrap" hidden>
              <div class="char-tabs" id="char-tabs" role="tablist"></div>
              <div class="tianzige" id="practise-pad"></div>
              <p class="feedback" id="practise-feedback" aria-live="polite"></p>
              <div class="actions center">
                <button class="btn" id="btn-animate" type="button">👀 看笔顺</button>
                <button class="btn" id="btn-trace" type="button">✏️ 描一描</button>
                <button class="btn" id="btn-free" type="button">✍️ 自己写</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Read a saved story -->
      <section id="view-read" class="view" hidden>
        <h2 class="play-title" id="read-title"></h2>
        <ol class="story-flow" id="read-flow"></ol>
        <div class="actions">
          <button class="btn" id="btn-read-saved" type="button">🔊 读整个故事</button>
          <button class="btn btn-danger" id="btn-delete-saved" type="button">删除</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/story-builder/main.ts"></script>
  </body>
</html>
