<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe0b8" />
    <title>Idiom Reveal — Snippet 2 Prototype</title>
    <link rel="stylesheet" href="/src/idiom-reveal/style.css" />

    <script type="module" src="/src/idiom-reveal/main.ts"></script>
